    <text x="900" y="251.5" font-size="13.5" font-weight="700" fill="#1a1f24" text-anchor="end">328%</text>
    <text x="849" y="251.5" font-size="10" fill="#1a1f24" text-anchor="end">5,034 vs 17,129 ms</text>
    <text x="12" y="291.5" font-size="12.5" fill="#9fb1c9">TTFT at depth, WARM (1-token, d8192, cache hit)</text>
    <rect x="270" y="274" width="137" height="26" rx="4" fill="#d29922"/>
    <text x="415" y="291.5" font-size="13.5" font-weight="700" fill="#d29922">70%</text>
    <text x="447" y="291.5" font-size="10" fill="#8b949e">302 vs ~212 ms</text>
    <text x="12" y="331.5" font-size="12.5" fill="#9fb1c9">prefill (benchy pp2048 @ d0)</text>
    <rect x="270" y="314" width="148" height="26" rx="4" fill="#d29922"/>
    <text x="426" y="331.5" font-size="13.5" font-weight="700" fill="#d29922">76%</text>
    <text x="458" y="331.5" font-size="10" fill="#8b949e">1,150 vs 1,518 tok/s</text>
    <text x="12" y="371.5" font-size="12.5" fill="#9fb1c9">streaming latency per token (ITL)</text>
    <rect x="270" y="354" width="213" height="26" rx="4" fill="#3fb950"/>
    <text x="491" y="371.5" font-size="13.5" font-weight="700" fill="#3fb950">109%</text>
    <text x="532" y="371.5" font-size="10" fill="#8b949e">15.6 vs 17.0 ms/token</text>
  </g>

  <!-- the 100% line -->
  <line x1="465" y1="26" x2="465" y2="388" stroke="#8b949e" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <text x="12" y="410" font-size="10" fill="#8b949e">Yellow = open fronts; green = won. Higher is always better (time metrics inverted). Receipts (2026-11-06): the served default is the TR3-4bpw checkpoint on TensorFold v1.2.3 (6ec5fa4cb — the</text>

