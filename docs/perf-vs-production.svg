<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

  <text x="12" y="18" font-size="14.5" font-weight="700" fill="#e6edf3">The fronts — this line vs production 0.6.6 (same harness</text>
  <text x="465" y="18" font-size="10.5" fill="#8b949e" text-anchor="middle">production = 100%</text>

  <!-- rows: label | bar | % + raw values; higher is always better (time metrics inverted) -->
  <g>
    <text x="12" y="51.5" font-size="12.5" fill="#9fb1c9">loading (warm restart wall)</text>
    <rect x="270" y="34" width="178" height="26" rx="4" fill="#d29922"/>
    <text x="456" y="51.5" font-size="13.5" font-weight="700" fill="#d29922">91%</text>
    <text x="488" y="51.5" font-size="10" fill="#8b949e">103 vs 93.7 s</text>
    <text x="12" y="91.5" font-size="12.5" fill="#9fb1c9">decode solo (2048-token, measured)</text>
    <rect x="270" y="74" width="219" height="26" rx="4" fill="#3fb950"/>
    <text x="497" y="91.5" font-size="13.5" font-weight="700" fill="#3fb950">112%</text>
    <text x="538" y="91.5" font-size="10" fill="#8b949e">65.9 vs 58.7 t/s</text>
    <text x="12" y="131.5" font-size="12.5" fill="#9fb1c9">decode c2 aggregate (measured)</text>
    <rect x="270" y="114" width="252" height="26" rx="4" fill="#3fb950"/>
    <text x="530" y="131.5" font-size="13.5" font-weight="700" fill="#3fb950">129%</text>
    <text x="571" y="131.5" font-size="10" fill="#8b949e">113.1 vs 87.4 t/s</text>
    <text x="12" y="171.5" font-size="12.5" fill="#9fb1c9">decode c4 aggregate (measured)</text>
    <rect x="270" y="154" width="160" height="26" rx="4" fill="#d29922"/>
    <text x="438" y="171.5" font-size="13.5" font-weight="700" fill="#d29922">82%</text>
    <text x="470" y="171.5" font-size="10" fill="#8b949e">158.6 vs 193.1 t/s</text>
    <text x="12" y="211.5" font-size="12.5" fill="#9fb1c9">request overhead (TTFT, 1-token, solo)</text>
    <rect x="270" y="194" width="193" height="26" rx="4" fill="#d29922"/>
    <text x="471" y="211.5" font-size="13.5" font-weight="700" fill="#d29922">99%</text>
    <text x="503" y="211.5" font-size="10" fill="#8b949e">187 vs 185 ms</text>
    <text x="12" y="251.5" font-size="12.5" fill="#9fb1c9">TTFT at depth, COLD (1-token, d8192, novel fill)</text>
    <rect x="270" y="234" width="640" height="26" rx="4" fill="#3fb950"/>
    <text x="900" y="251.5" font-size="13.5" font-weight="700" fill="#1a1f24" text-anchor="end">328%</text>
    <text x="849" y="251.5" font-size="10" fill="#1a1f24" text-anchor="end">3,990 vs 17,129 ms</text>
    <text x="12" y="291.5" font-size="12.5" fill="#9fb1c9">TTFT at depth, WARM (1-token, d8192, cache hit)</text>
    <rect x="270" y="274" width="137" height="26" rx="4" fill="#d29922"/>
    <text x="415" y="291.5" font-size="13.5" font-weight="700" fill="#d29922">70%</text>
    <text x="447" y="291.5" font-size="10" fill="#8b949e">302 vs ~212 ms</text>
    <text x="12" y="331.5" font-size="12.5" fill="#9fb1c9">prefill (benchy pp2048 @ d0)</text>
    <rect x="270" y="314" width="187" height="26" rx="4" fill="#d29922"/>
    <text x="465" y="331.5" font-size="13.5" font-weight="700" fill="#d29922">96%</text>
    <text x="497" y="331.5" font-size="10" fill="#8b949e">1,458 vs 1,518 tok/s</text>
    <text x="12" y="371.5" font-size="12.5" fill="#9fb1c9">streaming latency per token (ITL)</text>
    <rect x="270" y="354" width="215" height="26" rx="4" fill="#3fb950"/>
    <text x="493" y="371.5" font-size="13.5" font-weight="700" fill="#3fb950">110%</text>
    <text x="534" y="371.5" font-size="10" fill="#8b949e">15.4 vs 17.0 ms/token</text>
  </g>

  <!-- the 100% line -->
  <line x1="465" y1="26" x2="465" y2="388" stroke="#8b949e" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <text x="12" y="410" font-size="10" fill="#8b949e">Yellow = open fronts; green = won. Higher is always better (time metrics inverted). Receipts (2026-11-06): the served default is the TR3-4bpw checkpoint on TensorFold v1.2.3 (6ec5fa4cb) + the EIGHT-patch</text>

</svg>
