<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

  <text x="12" y="18" font-size="14.5" font-weight="700" fill="#e6edf3">The fronts — this line vs production 0.6.6 (same harness</text>
  <text x="414" y="18" font-size="10.5" fill="#8b949e" text-anchor="middle">production = 100%</text>

  <!-- rows: label | bar | % + raw values; higher is always better (time metrics inverted) -->
  <g>
    <text x="12" y="51.5" font-size="12.5" fill="#9fb1c9">loading (warm restart wall)</text>
    <rect x="270" y="34" width="163" height="26" rx="4" fill="#3fb950"/>
    <text x="441" y="51.5" font-size="13.5" font-weight="700" fill="#3fb950">113%</text>
    <text x="482" y="51.5" font-size="10" fill="#8b949e">83 vs 93.7 s</text>
    <text x="12" y="91.5" font-size="12.5" fill="#9fb1c9">decode solo (2048-token, measured)</text>
    <rect x="270" y="74" width="167" height="26" rx="4" fill="#3fb950"/>
    <text x="445" y="91.5" font-size="13.5" font-weight="700" fill="#3fb950">116%</text>
    <text x="486" y="91.5" font-size="10" fill="#8b949e">68.2 vs 58.6 t/s</text>
    <text x="12" y="131.5" font-size="12.5" fill="#9fb1c9">decode c2 aggregate (measured)</text>
    <rect x="270" y="114" width="197" height="26" rx="4" fill="#3fb950"/>
    <text x="475" y="131.5" font-size="13.5" font-weight="700" fill="#3fb950">137%</text>
    <text x="516" y="131.5" font-size="10" fill="#8b949e">118.1 vs 86.4 t/s</text>
    <text x="12" y="171.5" font-size="12.5" fill="#9fb1c9">decode c4 aggregate (measured)</text>
    <rect x="270" y="154" width="129" height="26" rx="4" fill="#d29922"/>
    <text x="407" y="171.5" font-size="13.5" font-weight="700" fill="#d29922">90%</text>
    <text x="439" y="171.5" font-size="10" fill="#8b949e">168.9 vs 188.2 t/s</text>
    <text x="12" y="211.5" font-size="12.5" fill="#9fb1c9">request overhead (TTFT, 1-token, solo)</text>
    <rect x="270" y="194" width="141" height="26" rx="4" fill="#d29922"/>
    <text x="419" y="211.5" font-size="13.5" font-weight="700" fill="#d29922">98%</text>
    <text x="451" y="211.5" font-size="10" fill="#8b949e">185 vs 182 ms</text>
    <text x="12" y="251.5" font-size="12.5" fill="#9fb1c9">TTFT at depth, COLD (1-token, d8192, novel fill)</text>
    <rect x="270" y="234" width="640" height="26" rx="4" fill="#3fb950"/>
    <text x="900" y="251.5" font-size="13.5" font-weight="700" fill="#1a1f24" text-anchor="end">445%</text>
    <text x="849" y="251.5" font-size="10" fill="#1a1f24" text-anchor="end">3,845 vs 17,129 ms</text>
    <text x="12" y="291.5" font-size="12.5" fill="#9fb1c9">TTFT at depth, WARM (1-token, d8192, cache hit)</text>
    <rect x="270" y="274" width="101" height="26" rx="4" fill="#d29922"/>
    <text x="379" y="291.5" font-size="13.5" font-weight="700" fill="#d29922">70%</text>
    <text x="411" y="291.5" font-size="10" fill="#8b949e">302 vs ~212 ms</text>
    <text x="12" y="331.5" font-size="12.5" fill="#9fb1c9">prefill (benchy pp2048 @ d0)</text>
    <rect x="270" y="314" width="141" height="26" rx="4" fill="#d29922"/>
    <text x="419" y="331.5" font-size="13.5" font-weight="700" fill="#d29922">98%</text>
    <text x="451" y="331.5" font-size="10" fill="#8b949e">1,495 vs 1,518 tok/s</text>
    <text x="12" y="371.5" font-size="12.5" fill="#9fb1c9">streaming latency per token (ITL)</text>
    <rect x="270" y="354" width="170" height="26" rx="4" fill="#3fb950"/>
    <text x="448" y="371.5" font-size="13.5" font-weight="700" fill="#3fb950">118%</text>
    <text x="489" y="371.5" font-size="10" fill="#8b949e">14.7 vs 17.4 ms/token</text>
  </g>

  <!-- the 100% line -->
  <line x1="414" y1="26" x2="414" y2="388" stroke="#8b949e" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <text x="12" y="410" font-size="10" fill="#8b949e">Yellow = open fronts; green = won. Higher is always better (time metrics inverted). Receipts (2026-11-07): the served default is the TR3-4bpw checkpoint (reshared locally 120 -> 55 shards, byte-identical,</text>

</svg>
